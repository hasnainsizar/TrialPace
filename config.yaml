# All tunable settings for trialpace. Nothing here is hardcoded in the package.

api:
  base_url: https://clinicaltrials.gov/api/v2/studies
  page_size: 200
  timeout_seconds: 60
  max_retries: 5
  backoff_seconds: 2.0
  # Field names in the ClinicalTrials.gov v2 "fields" parameter.
  fields:
    - NCTId
    - BriefTitle
    - LeadSponsorName
    - OverallStatus
    - Phase
    - Condition
    - InterventionName
    - InterventionType
    - LeadSponsorClass
    - EnrollmentCount
    - EnrollmentType
    - StartDate
    - PrimaryCompletionDate
    - PrimaryCompletionDateType
    - CompletionDate
    - LastUpdatePostDate
    - LocationFacility
    - LocationCity
    - LocationState
    - LocationCountry
    - LocationStatus

search:
  conditions:
    - aortic stenosis
    - aortic regurgitation
    - mitral regurgitation
    - tricuspid regurgitation
  terms:
    - TAVR
    - TAVI
    - transcatheter aortic valve
    - transcatheter mitral
    - transcatheter tricuspid
  study_type: INTERVENTIONAL
  start_date_min: "2010-01-01"

# Scope filters applied at load time, in this order. Each step logs what it removed.
scope:
  require_device_intervention: true
  device_intervention_type: DEVICE
  require_transcatheter_term: true
  # Matched case-insensitively against the title and intervention names.
  transcatheter_terms:
    - TAVR
    - TAVI
    - transcatheter
  product_names:
    - SAPIEN
    - Evolut
    - CoreValve
    - Navitor
    - Portico
    - Acurate
    - Lotus
    - Myval
    - Allegra
    - JenaValve
    - Centera
    - MitraClip
    - PASCAL
    - Tendyne
    - Intrepid
    - Cardioband
    - Carillon
    - Cardiovalve
    - AltaValve
    - Tiara
    - TriClip
    - EVOQUE
    - Tricento
    - Trilogy
    - LuX-Valve
  industry_only: true
  industry_sponsor_class: INDUSTRY

sponsors:
  default: Other
  # Case-insensitive substring match against the lead sponsor name.
  # First match wins, in the order listed.
  mapping:
    Edwards Lifesciences:
      - edwards
    Medtronic:
      - medtronic
    Boston Scientific:
      - boston scientific
    Abbott:
      - abbott
      - st. jude
      - st jude

valve_types:
  default: other
  # Keywords matched against conditions, interventions, and title (lowercased).
  # Order matters: the first valve type with a hit wins.
  keywords:
    tricuspid:
      - tricuspid
    mitral:
      - mitral
    aortic:
      - aortic
      - tavr
      - tavi

forecast:
  active_statuses:
    - RECRUITING
    - ACTIVE_NOT_RECRUITING
  benchmark_statuses:
    - COMPLETED
  # Segments with fewer benchmark trials than this fall back to the overall rate.
  min_segment_count: 5
  # Benchmark trials shorter than this are excluded as implausible.
  min_months: 3.0
  # Benchmark trials must list at least this many sites.
  min_benchmark_sites: 5
  # Model used for forecast outputs: auto (lowest median backtest error), rate, regression, or naive.
  model: auto
  # Regression needs at least this many benchmark rows to fit.
  min_regression_rows: 20
  # Active trials whose median forecast runs past this many months from start
  # are excluded. Almost always a large target with an incomplete site list.
  max_horizon_months: 240
  days_per_month: 30.4375
  # A trial is stale when its last update was posted more than this many months before the snapshot.
  stale_after_months: 12
  size_bands:
    - name: small
      max_enrollment: 100
    - name: medium
      max_enrollment: 500
    - name: large
      max_enrollment: null
  # Gap = median forecast date minus posted primary completion date, in days.
  status_thresholds:
    on_track_max_days: 90
    at_risk_max_days: 365
  # Label priority: past_posted_date, then past_forecast, then no_posted_date, then the gap thresholds.
  labels:
    past_posted_date: Past posted date
    past_forecast: Past forecast
    on_track: On track
    at_risk: At risk
    likely_late: Likely late
    no_posted_date: No posted date

backtest:
  # Leave-one-out cross-validation over every benchmark trial.
  # Below this many benchmark trials the comparison is flagged as thin.
  min_benchmarks_for_confidence: 30

paths:
  raw_dir: data/raw
  db_path: data/trialpace.db
  powerbi_dir: data/powerbi
  excel_path: data/excel/trialpace_export.xlsx
  method_path: METHOD.md
